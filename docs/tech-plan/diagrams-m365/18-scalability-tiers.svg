-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p><b>50+ sites or selling<br />to other companies</b><br /><br />Throttling, flow allowances,<br />per-customer separation<br />→ move data to Dataverse /<br />Azure SQL / Postgres</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-d-6" data-look="neo" transform="translate(88, 333.8125)"><rect class="basic label-container" style="" x="-76" y="-63" width="152" height="126"/><g class="label" style="" transform="translate(-60, -51)"><rect/><foreignObject width="120" height="102"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Apps (Expo, Next.js)<br />scale without change</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-e-12" data-look="neo" transform="translate(472, 532.125)"><rect class="basic label-container" style="" x="-76" y="-88.5" width="152" height="177"/><g class="label" style="" transform="translate(-60, -76.5)"><rect/><foreignObject width="120" height="153"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;"><span class="nodeLabel"><p>Data access kept in one<br />module (rule 9) → swap<br />the backend, not the apps</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0