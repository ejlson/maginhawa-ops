<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Site colour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*:not([style*="999px"]):not([style*="50%"]):not(.blob){corner-shape:superellipse(1.6)}
.sw,.qa,.ic,.pill,.chip,.btn{corner-shape:round}

a{color:#0066CC}a:hover{color:#004C99}
@keyframes driftA{0%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(-70px,34px) scale(1.25) rotate(25deg)}66%{transform:translate(50px,-24px) scale(.9) rotate(-12deg)}100%{transform:translate(0,0) scale(1) rotate(0deg)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1.05) rotate(0deg)}33%{transform:translate(64px,-28px) scale(.88) rotate(-20deg)}66%{transform:translate(-44px,30px) scale(1.2) rotate(14deg)}100%{transform:translate(0,0) scale(1.05) rotate(0deg)}}
.blob{position:absolute;border-radius:50%;z-index:-1;transition:background-color .4s ease}
.ba{animation:driftA 12s ease-in-out infinite}
.bb{animation:driftB 15s ease-in-out infinite}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.75}
.sw{width:44px;height:44px;border-radius:999px;border:0;padding:0;cursor:pointer;transition:transform .15s cubic-bezier(.23,1,.32,1),box-shadow .2s ease}
.sw:active{transform:scale(.92)}
.tint{transition:background-color .35s ease,color .25s ease}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:999px;background:linear-gradient(90deg,oklch(.68 .15 0),oklch(.68 .15 60),oklch(.68 .15 120),oklch(.68 .15 180),oklch(.68 .15 240),oklch(.68 .15 300),oklch(.68 .15 360));outline:none;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:999px;background:#FFFFFF;box-shadow:0 2px 10px rgba(0,0,0,.16),inset 0 0 0 2px rgba(0,0,0,.06);cursor:grab}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.ba,.bb{animation:none}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FFFFFF;color:#1D1D1F;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.012em">
  <div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:40px">
      <span aria-label="Back to Bunso settings" style="width:40px;height:40px;border-radius:999px;background:#F2F2F5;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></span>
      <span style="font-size:17px;font-weight:600">Site colour</span>
      <span style="width:40px"></span>
    </div>

    <div style="position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:20px 22px;height:180px;box-sizing:border-box;background:oklch(from {{cur.c}} .17 calc(c * .6) calc(h - 35));color:#F5F5F7;display:flex;flex-direction:column;justify-content:space-between">
      <div aria-hidden="true" class="blob ba" style="left:-70px;top:-90px;width:400px;height:287px;background:oklch(from {{cur.c}} .1 calc(c * .4) calc(h - 35));filter:blur(40px)"></div>
      <div aria-hidden="true" class="blob bb" style="right:-80px;top:-70px;width:325px;height:262px;background:{{cur.c}};filter:blur(42px)"></div>
      <div aria-hidden="true" class="blob ba" style="right:60px;bottom:-110px;width:337px;height:225px;background:oklch(from {{cur.c}} calc(l - .04) calc(c * 1.1) calc(h - 40));filter:blur(44px);opacity:.9"></div>
      <div aria-hidden="true" class="blob bb" style="right:-40px;bottom:-70px;width:212px;height:162px;background:oklch(from {{cur.light}} .95 calc(c * .6) h);filter:blur(36px);opacity:.9"></div>
      <svg aria-hidden="true" class="grain"><filter id="g7"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#g7)"></rect></svg>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="tint" style="width:34px;height:34px;border-radius:12px;background:{{cur.c}};color:{{cur.on}};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">BU</span>
        <span style="font-size:16px;font-weight:600">Bunso</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;color:rgba(245,245,247,.7)">Preview · net so far</span>
        <span style="font-size:36px;font-weight:600;letter-spacing:-0.05em;font-variant-numeric:tabular-nums">£1,840<span style="font-size:18px;color:rgba(245,245,247,.6)">.50</span></span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:20px;font-weight:700;letter-spacing:-0.025em">Colours</span><span style="font-size:14px;color:#6E6E73">{{cur.name}}</span></div>
      <div style="display:grid;grid-template-columns:repeat(6,44px);justify-content:space-between;row-gap:16px">
        <sc-for list="{{presets}}" as="p" hint-placeholder-count="12">
          <button class="sw" onClick="{{p.pick}}" aria-label="{{p.name}}" style="background:radial-gradient(120% 120% at 80% 90%, {{p.light}} 0%, {{p.c}} 40%, {{p.deep}} 85%);box-shadow:{{p.ring}}"></button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:16px;font-weight:600">Custom</span><span style="font-size:13px;color:#6E6E73">Drag to pick any shade</span></div>
      <input type="range" min="0" max="360" value="{{hue}}" onInput="{{setHue}}" aria-label="Custom colour">
    </div>

    <div style="display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:14px;height:62px;background:linear-gradient(rgba(0,0,0,.07),rgba(0,0,0,.07)) 56px 100%/calc(100% - 56px) 1px no-repeat">
        <span class="tint" style="width:42px;height:42px;border-radius:999px;background:{{cur.c}};color:{{cur.on}};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">Aa</span>
        <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">Text on this colour: {{cur.onName}}</span><span style="font-size:13px;color:#6E6E73">Picked for you, readable in light and dark</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:14px;height:62px">
        <span style="width:42px;height:42px;border-radius:999px;background:rgba(52,199,89,.14);color:#1F7A35;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">{{cur.check}}</span><span style="font-size:13px;color:#6E6E73">Green, amber and red stay for status</span></span>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:12px;align-items:center">
    <button style="width:100%;height:54px;border-radius:999px;background:#1D1D1F;color:#FFFFFF;font-size:17px;font-weight:600">Save for everyone at Bunso</button>
    <span style="font-size:13px;color:#6E6E73">Head office can change this · Undo for 10 seconds</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pick: 4, hue: 70 }; }
  renderVals() {
    const P = [
      ['Indigo','#3B5BDB','#A5B8FF','#141C66','#FFFFFF'],
      ['Leaf','#5C940D','#D8F5A2','#1F3D0A','#FFFFFF'],
      ['Plum','#9C36B5','#F3C4FF','#3B0F5C','#FFFFFF'],
      ['Walnut','#A0612A','#F5D0A9','#4A2410','#FFFFFF'],
      ['Mango','#F59F00','#FFE8A3','#D9480F','#1D1D1F'],
      ['Rose','#D6336C','#FFC9DE','#5C0F2E','#FFFFFF'],
      ['Teal','#0C8599','#99E9F2','#073B4C','#FFFFFF'],
      ['Lantern','#C92A2A','#FFB37A','#5C0A0A','#FFFFFF'],
      ['Ocean','#1971C2','#A5D8FF','#0B2A4A','#FFFFFF'],
      ['Grape','#6741D9','#D0BFFF','#24124F','#FFFFFF'],
      ['Olive','#868E2C','#E9EDB0','#2E3010','#FFFFFF'],
      ['Slate','#495057','#DEE2E6','#16191C','#FFFFFF']
    ];
    let cur;
    if (this.state.pick === -1) {
      const h = Number(this.state.hue);
      const dark = h > 55 && h < 150;
      cur = { name: 'Custom', c: 'oklch(.68 .15 ' + h + ')', light: 'oklch(.93 .07 ' + h + ')', deep: 'oklch(.36 .12 ' + (h - 20) + ')',
        on: dark ? '#1D1D1F' : '#FFFFFF', onName: dark ? 'dark' : 'white', check: 'Adjusted for readability' };
    } else {
      const x = P[this.state.pick];
      cur = { name: x[0], c: x[1], light: x[2], deep: x[3], on: x[4], onName: x[4] === '#FFFFFF' ? 'white' : 'dark', check: 'Passes contrast checks' };
    }
    return {
      cur,
      hue: this.state.hue,
      setHue: (e) => this.setState({ hue: e.target.value, pick: -1 }),
      presets: P.map((x, i) => ({ name: x[0], c: x[1], light: x[2], deep: x[3],
        ring: i === this.state.pick ? '0 0 0 3px #FFFFFF, 0 0 0 5px #1D1D1F' : '0 0 0 1px rgba(0,0,0,.06)',
        pick: () => this.setState({ pick: i }) }))
    };
  }
}
</script>
</body>
</html>
