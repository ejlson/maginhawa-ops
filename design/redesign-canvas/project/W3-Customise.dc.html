<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Customise home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*:not([style*="999px"]):not([style*="50%"]){corner-shape:superellipse(1.6)}
.x,.add,.arr,.btn{corner-shape:round}
@keyframes wig{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.tile{position:relative;background:#F7F7F9;border-radius:26px;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;min-height:96px;animation:wig .5s ease-in-out infinite,pop .25s cubic-bezier(.23,1,.32,1) both;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.tile.on{animation:none;transform:scale(1.03);box-shadow:0 0 0 2px #1D1D1F,0 18px 40px -18px rgba(0,0,0,.35)}
.th{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.th i{width:30px;height:30px;border-radius:10px;background:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06);font-style:normal}
.sk{height:8px;border-radius:4px;background:#E8E8ED}
.x{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:999px;border:0;background:#1D1D1F;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 3px #fff}
.arrs{display:flex;gap:6px;align-self:flex-end;margin-top:auto}
.arr{width:28px;height:28px;border-radius:999px;border:0;background:#FFFFFF;color:#1D1D1F;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.arr:disabled{opacity:.3;cursor:default}
.arr:focus,.x:focus,.add:focus{outline:none}.arr:focus-visible,.x:focus-visible,.add:focus-visible{outline:2px solid #0066CC;outline-offset:2px}
.tile{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .18s cubic-bezier(.23,1,.32,1),box-shadow .18s ease}
.tile.drag{animation:none;cursor:grabbing;transform:scale(1.04);box-shadow:0 0 0 2px #1D1D1F,0 22px 44px -18px rgba(0,0,0,.4);z-index:2}
.grip{position:absolute;top:14px;right:14px;color:#AEAEB2;display:flex}
.wrap.dragging .tile:not(.drag){animation:none}
.add{width:28px;height:28px;border-radius:999px;border:0;background:#1F7A35;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.trow{display:flex;align-items:center;gap:12px;height:56px;background:linear-gradient(rgba(0,0,0,.07),rgba(0,0,0,.07)) 52px 100%/calc(100% - 52px) 1px no-repeat}
.btn{height:48px;border-radius:999px;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:0 22px}
@media (prefers-reduced-motion: reduce){.tile{animation:none}}
</style>
</helmet>
<div style="width:390px;min-height:1060px;position:relative;overflow:hidden;background:#FFFFFF;color:#1D1D1F;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.012em">
  <div style="position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(0,0,0,.06)">
    <button class="btn" onClick="{{reset}}" style="height:36px;padding:0 4px;background:none;color:#0066CC;font-weight:500">Reset</button>
    <span style="font-size:17px;font-weight:600">Customise home</span>
    <button class="btn" onClick="{{done}}" style="height:36px;padding:0 16px;background:#1D1D1F;color:#fff">Done</button>
  </div>

  <div style="padding:20px 24px 40px;display:flex;flex-direction:column;gap:20px">
    <p style="margin:0;font-size:14px;color:#6E6E73;line-height:1.45">Tap – to hide a widget. Drag to move it, or use the arrows. The main card always stays at the top.</p>

    <div style="border-radius:24px;height:72px;background:linear-gradient(100deg,#3a1406,#C2410C 55%,#F59F00);color:#F5F5F7;display:flex;align-items:center;gap:12px;padding:0 18px;opacity:.85">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <span style="display:flex;flex-direction:column;line-height:1.2"><b style="font-size:15px;font-weight:600">Main card</b><span style="font-size:12px;opacity:.8">Tonight's net and Up next · always first</span></span>
    </div>

    <div class="wrap {{dragCls}}" onPointerUp="{{drop}}" onPointerLeave="{{drop}}" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
      <sc-for list="{{shown}}" as="w" hint-placeholder-count="5">
        <div class="tile {{w.onCls}}" onPointerDown="{{w.grab}}" onPointerEnter="{{w.over}}" aria-roledescription="draggable widget" style="grid-column:{{w.span}};animation-delay:{{w.delay}},{{w.delay}}">
          <button class="x" onClick="{{w.hide}}" aria-label="Hide {{w.name}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <span class="th"><i>{{w.glyph}}</i>{{w.name}}</span>
          <span class="grip" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></span>
          <span class="sk" style="width:80%"></span><span class="sk" style="width:55%"></span>
          <div class="arrs">
            <button class="arr" onClick="{{w.up}}" disabled="{{w.first}}" aria-label="Move {{w.name}} earlier"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
            <button class="arr" onClick="{{w.down}}" disabled="{{w.last}}" aria-label="Move {{w.name}} later"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px"><span style="font-size:20px;font-weight:700;letter-spacing:-0.025em">Add widgets</span><span style="font-size:13px;color:#6E6E73">{{hiddenCount}}</span></div>
      <sc-for list="{{hidden}}" as="w" hint-placeholder-count="2">
        <div class="trow">
          <span style="width:40px;height:40px;border-radius:12px;background:#F2F2F5;display:flex;align-items:center;justify-content:center;font-size:16px">{{w.glyph}}</span>
          <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">{{w.name}}</span><span style="font-size:13px;color:#6E6E73">{{w.desc}}</span></span>
          <button class="add" onClick="{{w.show}}" aria-label="Add {{w.name}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
        </div>
      </sc-for>
      <sc-if value="{{noneHidden}}" hint-placeholder-val="{{false}}"><p style="margin:8px 0 0;font-size:14px;color:#6E6E73">Every widget is on your home.</p></sc-if>
    </div>
  </div>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 12px 12px 18px;border-radius:999px;background:#1D1D1F;color:#fff;font-size:14px;white-space:nowrap;animation:toast .25s cubic-bezier(.23,1,.32,1) both;box-shadow:0 14px 34px -14px rgba(0,0,0,.45)">
      {{toast}}<button class="btn" onClick="{{undo}}" style="height:32px;padding:0 14px;background:rgba(255,255,255,.16);color:#fff;font-size:13px">Undo</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.def = { order: ['checklists','eod','stock','recipes','food'], hidden: ['handover','repairs'] };
    this.state = { order: this.def.order.slice(), hidden: this.def.hidden.slice(), toast: '', prev: null, moved: null, dragging: null };
  }
  renderVals() {
    const W = {
      checklists: { name: 'Checklists', glyph: '✓', wide: true, desc: 'Done today and the next due' },
      eod: { name: 'End of day report', glyph: '£', wide: true, desc: 'Sections left tonight' },
      stock: { name: 'Stock', glyph: '▣', wide: true, desc: 'Count, running low, deliveries' },
      recipes: { name: 'Recipes', glyph: '≡', wide: false, desc: 'Find a dish, recently opened' },
      food: { name: 'Food safety', glyph: '°', wide: false, desc: 'Log temp, delivery, allergens' },
      handover: { name: 'Handover', glyph: '⇄', wide: false, desc: 'Notes from last night' },
      repairs: { name: 'Repairs', glyph: '⚒', wide: false, desc: 'Open and urgent jobs' }
    };
    const st = this.state;
    const save = (patch, toast) => this.setState(Object.assign({ prev: { order: st.order, hidden: st.hidden }, toast: toast || '' }, patch));
    const move = (i, d) => { const o = st.order.slice(); const j = i + d; [o[i], o[j]] = [o[j], o[i]]; this.setState({ order: o, moved: o[j], toast: '' }); };
    return {
      shown: st.order.map((id, i) => Object.assign({}, W[id], {
        span: W[id].wide ? 'span 2' : 'span 1', delay: (i * 40) + 'ms', first: i === 0, last: i === st.order.length - 1,
        onCls: st.dragging === id ? 'drag' : st.moved === id ? 'on' : '',
        // Drag: press a widget, then move over another to swap places. Release capture so touch drags reach other tiles.
        grab: (e) => { if (e.target.closest && e.target.closest('button')) return; try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {} this.setState({ dragging: id, moved: null, toast: '' }); },
        over: () => { if (!st.dragging || st.dragging === id) return; const o = st.order.filter((x) => x !== st.dragging); o.splice(i, 0, st.dragging); this.setState({ order: o }); },
        hide: () => save({ order: st.order.filter((x) => x !== id), hidden: st.hidden.concat(id), moved: null }, W[id].name + ' hidden'),
        up: () => move(i, -1), down: () => move(i, 1)
      })),
      hidden: st.hidden.map((id) => Object.assign({}, W[id], { show: () => save({ order: st.order.concat(id), hidden: st.hidden.filter((x) => x !== id), moved: id }) })),
      dragCls: st.dragging ? 'dragging' : '',
      drop: () => st.dragging && this.setState({ dragging: null, moved: st.dragging }),
      hiddenCount: st.hidden.length ? st.hidden.length + ' not on your home' : '',
      noneHidden: st.hidden.length === 0,
      toast: st.toast,
      undo: () => st.prev && this.setState({ order: st.prev.order, hidden: st.prev.hidden, toast: '', prev: null }),
      reset: () => save({ order: this.def.order.slice(), hidden: this.def.hidden.slice(), moved: null }, 'Back to the manager layout'),
      done: () => this.setState({ toast: 'Saved to your account', moved: null })
    };
  }
}
</script>
</body>
</html>
