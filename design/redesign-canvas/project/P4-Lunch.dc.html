<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Lunch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*:not([style*="999px"]):not([style*="50%"]):not(.blob){corner-shape:superellipse(1.6)}
.sw,.qa,.ic,.pill,.chip,.btn{corner-shape:round}

a{color:#0066CC}a:hover{color:#004C99}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes driftA{0%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(-70px,34px) scale(1.25) rotate(25deg)}66%{transform:translate(50px,-24px) scale(.9) rotate(-12deg)}100%{transform:translate(0,0) scale(1) rotate(0deg)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1.05) rotate(0deg)}33%{transform:translate(64px,-28px) scale(.88) rotate(-20deg)}66%{transform:translate(-44px,30px) scale(1.2) rotate(14deg)}100%{transform:translate(0,0) scale(1.05) rotate(0deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.rise{animation:rise .45s cubic-bezier(.23,1,.32,1) both}
.blob{position:absolute;border-radius:50%;z-index:-1}
.ba{animation:driftA 12s ease-in-out infinite}
.bb{animation:driftB 15s ease-in-out infinite}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.75}
.press{transition:transform .12s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}
.field{height:44px;width:132px;box-sizing:border-box;border:0;border-radius:14px;background:#F2F2F5;padding:0 14px;font:inherit;font-size:17px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;color:#1D1D1F;outline:none;transition:box-shadow .15s ease}
.field:focus{box-shadow:0 0 0 2px #F59F00,0 0 0 5px rgba(245,159,0,.2)}
.step{transition:background-color .25s ease,color .25s ease}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.rise,.ba,.bb{animation:none}.press:active{transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FFFFFF;color:#1D1D1F;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.012em">
  <div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:28px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:40px">
      <a href="P3-Close.dc.html" aria-label="Back to End of day" style="width:40px;height:40px;border-radius:999px;background:#F2F2F5;display:flex;align-items:center;justify-content:center;color:#1D1D1F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <span style="font-size:17px;font-weight:600">Lunch</span>
      <span style="width:40px;text-align:right;font-size:13px;color:#6E6E73">{{stepNo}}/4</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:-8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <button class="step" onClick="{{s.pick}}" style="height:32px;border-radius:999px;font-size:13px;font-weight:600;background:{{s.bg}};color:{{s.col}}">{{s.label}}</button>
      </sc-for>
    </div>

    <div class="rise" style="position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:22px 24px;background:oklch(from #F59F00 .17 calc(c * .6) calc(h - 35));color:#F5F5F7;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 50px -26px rgba(217,72,15,.32)">
      <div aria-hidden="true" class="blob ba" style="left:-70px;top:-90px;width:400px;height:287px;background:oklch(from #F59F00 .1 calc(c * .4) calc(h - 35));filter:blur(40px)"></div>
      <div aria-hidden="true" class="blob bb" style="right:-80px;top:-70px;width:325px;height:262px;background:#F59F00;filter:blur(42px)"></div>
      <div aria-hidden="true" class="blob ba" style="right:60px;bottom:-110px;width:337px;height:225px;background:oklch(from #F59F00 calc(l - .04) calc(c * 1.1) calc(h - 40));filter:blur(44px);opacity:.9"></div>
      <div aria-hidden="true" class="blob bb" style="right:-40px;bottom:-110px;width:212px;height:162px;background:oklch(from #FFE8A3 .95 calc(c * .6) h);filter:blur(36px);opacity:.5"></div>
      <svg aria-hidden="true" class="grain"><filter id="g4"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#g4)"></rect></svg>
      <span style="font-size:13px;color:rgba(245,245,247,.66)">Lunch net · updates as you type</span>
      <span style="font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left;animation:pop .3s cubic-bezier(.23,1,.32,1)" key="{{net}}"><span style="font-size:48px;font-weight:600;letter-spacing:-0.055em">£{{netWhole}}</span><span style="font-size:24px;color:rgba(245,245,247,.6)">.{{netPence}}</span></span>
      <span style="font-size:13px;color:rgba(245,245,247,.8)">Gross − service − VAT − discounts</span>
    </div>

    <div style="display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span style="font-size:20px;font-weight:700;letter-spacing:-0.025em">From the till report</span><span style="font-size:13px;color:#6E6E73">Z report</span></div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <label style="display:flex;align-items:center;gap:12px;height:66px;border-bottom:1px solid rgba(0,0,0,.06)">
          <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:17px;font-weight:600">{{f.label}}</span><span style="font-size:13px;color:#6E6E73">{{f.hint}}</span></span>
          <input class="field" inputmode="decimal" value="{{f.value}}" onInput="{{f.set}}" aria-label="{{f.label}}">
        </label>
      </sc-for>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:#1F7A35;font-weight:500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Food and drink match the net</div>
    </div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:12px;align-items:center">
    <button class="press" onClick="{{next}}" style="width:100%;height:54px;border-radius:999px;background:#1D1D1F;color:#FFFFFF;font-size:17px;font-weight:600">Next: {{nextLabel}}</button>
    <span style="font-size:13px;color:#6E6E73">Saved on this phone · 21:42</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { step: 0, gross: '1,200.00', service: '120.00', vat: '180.00', disc: '50.00' }; }
  renderVals() {
    const n = (v) => { const x = parseFloat(String(v).replace(/[£,\s]/g, '')); return isNaN(x) ? 0 : x; };
    const net = n(this.state.gross) - n(this.state.service) - n(this.state.vat) - n(this.state.disc);
    const fixed = Math.abs(net).toFixed(2).split('.');
    const whole = (net < 0 ? '−' : '') + Number(fixed[0]).toLocaleString('en-GB');
    const labels = ['Till', 'Covers', 'Cash', 'Discounts'];
    const mk = (key, label, hint) => ({ label, hint, value: this.state[key], set: (e) => this.setState({ [key]: e.target.value }) });
    return {
      net: net.toFixed(2), netWhole: whole, netPence: fixed[1],
      stepNo: this.state.step + 1,
      nextLabel: labels[Math.min(this.state.step + 1, 3)] === labels[this.state.step] ? 'Review lunch' : labels[this.state.step + 1].toLowerCase(),
      next: () => this.setState({ step: Math.min(this.state.step + 1, 3) }),
      steps: labels.map((label, i) => ({ label,
        bg: i === this.state.step ? '#1D1D1F' : i < this.state.step ? '#FDE8BF' : '#F2F2F5',
        col: i === this.state.step ? '#FFFFFF' : i < this.state.step ? '#7A4A00' : '#6E6E73',
        pick: () => this.setState({ step: i }) })),
      fields: [
        mk('gross', 'Gross sales', 'Total on the Z report'),
        mk('service', 'Service charge', 'Goes to Tips'),
        mk('vat', 'VAT', 'From the till'),
        mk('disc', 'Discounts and comps', 'Lines come next')
      ]
    };
  }
}
</script>
</body>
</html>
