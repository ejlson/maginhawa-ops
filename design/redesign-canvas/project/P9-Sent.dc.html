<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Day sent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*:not([style*="999px"]):not([style*="50%"]):not(.blob){corner-shape:superellipse(1.6)}
.sw,.qa,.ic,.pill,.chip,.btn{corner-shape:round}
a{color:#0066CC}a:hover{color:#004C99}
@keyframes driftA{0%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(-70px,34px) scale(1.25) rotate(25deg)}66%{transform:translate(50px,-24px) scale(.9) rotate(-12deg)}100%{transform:translate(0,0) scale(1) rotate(0deg)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1.05) rotate(0deg)}33%{transform:translate(64px,-28px) scale(.88) rotate(-20deg)}66%{transform:translate(-44px,30px) scale(1.2) rotate(14deg)}100%{transform:translate(0,0) scale(1.05) rotate(0deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.blob{position:absolute;border-radius:50%;z-index:-1}
.ba{animation:driftA 12s ease-in-out infinite}
.bb{animation:driftB 15s ease-in-out infinite}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.75}
.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) .15s both}
.draw{stroke-dasharray:30;animation:draw .4s cubic-bezier(.23,1,.32,1) .45s both}
.rise{animation:rise .45s cubic-bezier(.23,1,.32,1) both}
.press{transition:transform .12s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){.ba,.bb,.pop,.draw,.rise{animation:none}.press:active{transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FFFFFF;color:#1D1D1F;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.012em">
  <div style="padding:64px 24px 0;display:flex;flex-direction:column;gap:28px">

    <div style="position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:32px 24px 24px;background:oklch(from #F59F00 .17 calc(c * .6) calc(h - 35));color:#F5F5F7;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;box-shadow:0 18px 50px -26px rgba(217,72,15,.32)">
      <div aria-hidden="true" class="blob ba" style="left:-70px;top:-90px;width:400px;height:287px;background:oklch(from #F59F00 .1 calc(c * .4) calc(h - 35));filter:blur(40px)"></div>
      <div aria-hidden="true" class="blob bb" style="right:-80px;top:-70px;width:325px;height:262px;background:#F59F00;filter:blur(42px)"></div>
      <div aria-hidden="true" class="blob ba" style="right:60px;bottom:-110px;width:337px;height:225px;background:oklch(from #F59F00 calc(l - .04) calc(c * 1.1) calc(h - 40));filter:blur(44px);opacity:.9"></div>
      <div aria-hidden="true" class="blob bb" style="right:-40px;bottom:-110px;width:212px;height:162px;background:oklch(from #FFE8A3 .95 calc(c * .6) h);filter:blur(36px);opacity:.5"></div>
      <svg aria-hidden="true" class="grain"><filter id="g9"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#g9)"></rect></svg>
      <span class="pop" style="width:72px;height:72px;border-radius:999px;background:rgba(255,248,240,.92);display:flex;align-items:center;justify-content:center;margin-bottom:6px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sent"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
      <span style="font-size:34px;font-weight:600;letter-spacing:-0.04em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.18)">Day closed</span>
      <span style="font-size:15px;color:rgba(245,245,247,.82);text-shadow:0 1px 10px rgba(0,0,0,.18)">Thursday 12 Nov · £2,687.50 net</span>
      <span style="margin-top:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;backdrop-filter:blur(6px)"><span style="width:7px;height:7px;border-radius:50%;background:#4CD964"></span>Head office has it · 00:31</span>
    </div>

    <div class="rise" style="display:flex;flex-direction:column;animation-delay:200ms">
      <span style="font-size:20px;font-weight:700;letter-spacing:-0.025em;margin-bottom:4px">What happens next</span>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:14px;min-height:62px;border-bottom:1px solid rgba(0,0,0,.07)">
          <span class="ic" style="width:40px;height:40px;border-radius:50%;background:#F2F2F5;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
          <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:16px;font-weight:600">{{r.title}}</span><span style="font-size:14px;color:#6E6E73">{{r.sub}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:30px;display:flex;flex-direction:column;gap:14px;align-items:center">
    <span style="font-size:14px;color:#6E6E73">On time 26 of 28 days this month</span>
    <a href="P1-Today.dc.html" class="press" style="width:100%;height:56px;border-radius:999px;background:#1D1D1F;color:#FFFFFF;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Done</a>
  </div>
</div>
</x-dc>

  renderVals() {
    return { rows: [

      { icon: 'M5 4h14v16H5zM9 9h6M9 13h6', title: 'Need to change something?', sub: 'Ask head office to send it back' }
    ] };
  }
}
</script>
</body>
</html>
