<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Count the bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*:not([style*="999px"]):not([style*="50%"]):not(.blob){corner-shape:superellipse(1.6)}
.sw,.qa,.ic,.pill,.chip,.btn{corner-shape:round}
a{color:#0066CC}a:hover{color:#004C99}
@keyframes driftA{0%{transform:translate(0,0) scale(1) rotate(0deg)}33%{transform:translate(-70px,34px) scale(1.25) rotate(25deg)}66%{transform:translate(50px,-24px) scale(.9) rotate(-12deg)}100%{transform:translate(0,0) scale(1) rotate(0deg)}}
@keyframes driftB{0%{transform:translate(0,0) scale(1.05) rotate(0deg)}33%{transform:translate(64px,-28px) scale(.88) rotate(-20deg)}66%{transform:translate(-44px,30px) scale(1.2) rotate(14deg)}100%{transform:translate(0,0) scale(1.05) rotate(0deg)}}
.blob{position:absolute;border-radius:50%;z-index:-1}
.ba{animation:driftA 12s ease-in-out infinite}
.bb{animation:driftB 15s ease-in-out infinite}
.grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.75}
.press{transition:transform .12s cubic-bezier(.23,1,.32,1)}
.press:active{transform:scale(.94)}
.count{width:170px;height:96px;border:0;background:transparent;font:inherit;font-size:80px;font-weight:600;letter-spacing:-0.05em;text-align:center;font-variant-numeric:tabular-nums;color:#1D1D1F;outline:none;border-radius:24px;transition:background-color .15s ease}
.count:focus{background:#F7F7F9}
.count::placeholder{color:#D1D1D6}
.seg{transition:background-color .3s ease}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
@media (prefers-reduced-motion: reduce){.ba,.bb{animation:none}.press:active{transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#FFFFFF;color:#1D1D1F;font-family:Geist,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-0.012em">
  <div style="padding:24px 24px 0;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;height:40px">
      <a href="S2-StockAreas.dc.html" aria-label="Stop counting" style="width:40px;height:40px;border-radius:999px;background:#F2F2F5;display:flex;align-items:center;justify-content:center;color:#1D1D1F"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <span style="font-size:17px;font-weight:600">Bar · {{pos}} of {{total}}</span>
      <span style="width:40px"></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:-12px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="5"><span class="seg" style="height:4px;border-radius:999px;background:{{s.c}}"></span></sc-for>
    </div>

    <div style="position:relative;overflow:hidden;isolation:isolate;border-radius:32px;padding:26px 24px;background:oklch(from #F59F00 .17 calc(c * .6) calc(h - 35));color:#F5F5F7;display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 50px -26px rgba(217,72,15,.32)">
      <div aria-hidden="true" class="blob ba" style="left:-70px;top:-90px;width:400px;height:287px;background:oklch(from #F59F00 .1 calc(c * .4) calc(h - 35));filter:blur(40px)"></div>
      <div aria-hidden="true" class="blob bb" style="right:-80px;top:-70px;width:325px;height:262px;background:#F59F00;filter:blur(42px)"></div>
      <div aria-hidden="true" class="blob ba" style="right:60px;bottom:-110px;width:337px;height:225px;background:oklch(from #F59F00 calc(l - .04) calc(c * 1.1) calc(h - 40));filter:blur(44px);opacity:.9"></div>
      <div aria-hidden="true" class="blob bb" style="right:-40px;bottom:-110px;width:212px;height:162px;background:oklch(from #FFE8A3 .95 calc(c * .6) h);filter:blur(36px);opacity:.5"></div>
      <svg aria-hidden="true" class="grain"><filter id="gs3"><feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gs3)"></rect></svg>
      <span style="font-size:14px;color:rgba(245,245,247,.72);text-shadow:0 1px 10px rgba(0,0,0,.18)">{{where}}</span>
      <span style="font-size:34px;font-weight:600;letter-spacing:-0.04em;line-height:1.1;text-shadow:0 1px 10px rgba(0,0,0,.18)">{{name}}</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:8px">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="press btn" onClick="{{minus}}" aria-label="One less" style="width:60px;height:60px;border-radius:999px;background:#F2F2F5;display:flex;align-items:center;justify-content:center"><span style="font-size:28px;line-height:1;color:#1D1D1F" aria-hidden="true">−</span></button>
        <input class="count" inputmode="decimal" placeholder="0" value="{{value}}" onInput="{{type}}" aria-label="{{aria}}">
        <button class="press btn" onClick="{{plus}}" aria-label="One more" style="width:60px;height:60px;border-radius:999px;background:#F2F2F5;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg></button>
      </div>
      <span style="font-size:17px;color:#6E6E73">{{unit}}</span>
      <sc-if value="{{warn}}" hint-placeholder-val="{{false}}">
        <span style="margin-top:14px;padding:10px 16px;border-radius:999px;background:rgba(255,149,0,.16);color:#B25000;font-size:14px;font-weight:500">Last time it was {{last}}. Worth a second look.</span>
      </sc-if>
      <sc-if value="{{calm}}" hint-placeholder-val="{{true}}">
        <span style="margin-top:14px;padding:10px 16px;font-size:14px;color:#8E8E93">{{hint}}</span>
      </sc-if>
    </div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:34px;display:flex;flex-direction:column;gap:14px;align-items:center">
    <sc-if value="{{more}}" hint-placeholder-val="{{true}}">
      <button class="press" onClick="{{next}}" style="width:100%;height:56px;border-radius:999px;background:#1D1D1F;color:#FFFFFF;font-size:17px;font-weight:600">Next: {{nextName}}</button>
    </sc-if>
    <sc-if value="{{last1}}" hint-placeholder-val="{{false}}">
      <a href="S4-StockReview.dc.html" class="press" style="width:100%;height:56px;border-radius:999px;background:#1D1D1F;color:#FFFFFF;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">Finish Bar</a>
    </sc-if>
    <sc-if value="{{canBack}}" hint-placeholder-val="{{true}}">
      <button onClick="{{back}}" style="font-size:15px;font-weight:500;color:#0066CC">Back to {{prevName}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { i: 3, v: ['5.4', '7.6', '3.5', '4', ''] };
  }
  renderVals() {
    const ITEMS = [
      { name: 'Tanduay rum', where: 'Back bar', unit: 'bottles', last: 6.4, part: true },
      { name: "Gordon's gin", where: 'Back bar', unit: 'bottles', last: 8.2, part: true },
      { name: 'Jameson', where: 'Back bar', unit: 'bottles', last: 4, part: true },
      { name: 'Prosecco', where: 'Wine fridge', unit: 'bottles', last: 18 },
      { name: 'San Miguel', where: 'Beer fridge', unit: 'bottles', last: 70 }
    ];
    const s = this.state, i = s.i, it = ITEMS[i];
    const num = (x) => { const n = parseFloat(String(x || '').replace(',', '.')); return isNaN(n) ? 0 : n; };
    const val = s.v[i];
    const typed = String(val).trim() !== '';
    const off = typed && Math.abs(num(val) - it.last) / it.last > 0.5;
    const setV = (x) => { const v = s.v.slice(); v[i] = x; this.setState({ v }); };
    const round = (n) => String(Math.round(n * 10) / 10);
    return {
      pos: i + 1, total: ITEMS.length, name: it.name, where: it.where, unit: it.unit, last: it.last,
      value: val, aria: it.name + ', ' + it.unit,
      type: (e) => setV(e.target.value),
      minus: () => setV(round(Math.max(0, num(val) - 1))),
      plus: () => setV(round(num(val) + 1)),
      warn: off, calm: !off,
      hint: it.part ? 'Part bottle? Type it, like 5.4' : 'Count loose and in cases',
      segs: ITEMS.map((_, k) => ({ c: k < i || String(s.v[k]).trim() !== '' ? '#F59F00' : k === i ? '#FDE8BF' : '#E5E5EA' })),
      more: i < ITEMS.length - 1, last1: i === ITEMS.length - 1,
      nextName: i < ITEMS.length - 1 ? ITEMS[i + 1].name : '',
      next: () => this.setState({ i: Math.min(i + 1, ITEMS.length - 1) }),
      canBack: i > 0, prevName: i > 0 ? ITEMS[i - 1].name : '',
      back: () => this.setState({ i: Math.max(0, i - 1) })
    };
  }
}
</script>
</body>
</html>
