<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cash count · first-time tip</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="checks.css">
<link rel="stylesheet" href="tour.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ph scr {{theme}}" style="height: 844px">
<div class="nav"><a class="back" href="#lunch"><svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 1.5L1.5 8.5l7 7"></path></svg>Lunch</a><span style="font-weight: 600">Count the cash</span><span style="width: 60px"></span></div>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 8px 20px 0">
<sc-if value="{{showHint}}" hint-placeholder-val="{{true}}">
<div class="hint" role="note">
<span class="av" style="background: var(--bg); width: 36px; height: 36px"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M9 13h.01M9 16A7 7 0 1 0 9 2a7 7 0 0 0 0 14z"></path></svg></span>
<span class="tx"><span>First time counting?</span><small>Type how many of each note and coin. We add it up and take off the £150.00 float.</small><button type="button" class="lnk" style="align-self: flex-start; padding: 0; min-height: 36px" onClick="{{gotIt}}">Got it</button></span>
</div>
</sc-if>
<div class="hero" style="gap: 14px">
<span class="hl">Counted in the drawer</span>
<div class="big"><b>{{totalPounds}}</b><i>{{totalPence}}</i></div>
<div class="hm" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><span>£150.00<small>Less float</small></span><span>{{takenText}}<small>Cash taken</small></span></div>
</div>
<div class="sub">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div class="fr" style="min-height: 56px">
<span class="av" style="width: 52px; border-radius: 12px; font-size: 13px">{{r.label}}</span>
<span class="tx"><span style="font-size: 15px; color: var(--sec)">{{r.valueText}}</span></span>
<input class="in" style="width: 88px; text-align: center" inputmode="numeric" aria-label="{{r.aria}}" value="{{r.count}}" onInput="{{r.set}}">
</div>
</sc-for>
</div>
</div>
<sc-if value="{{hidToast}}" hint-placeholder-val="{{false}}">
<div class="toast" role="status" style="bottom: 34px"><span>Tip hidden. Bring it back in Account.</span><button type="button" onClick="{{undo}}">Undo</button></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hint: true, toast: false, counts: { 5000: '', 2000: '', 1000: '', 500: '', 200: '', 100: '' } };
  }
  renderVals() {
    const { hint, toast, counts } = this.state;
    const money = (p) => '£' + (p / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const denoms = [[5000, '£50'], [2000, '£20'], [1000, '£10'], [500, '£5'], [200, '£2'], [100, '£1']];
    let total = 0;
    const rows = denoms.map(([p, label]) => {
      const n = parseInt(counts[p], 10) || 0;
      total += n * p;
      return {
        label,
        aria: 'How many ' + label,
        count: counts[p],
        valueText: n ? money(n * p) : '—',
        set: (e) => this.setState({ counts: Object.assign({}, counts, { [p]: e.target.value.replace(/[^0-9]/g, '') }) })
      };
    });
    const whole = money(total);
    const taken = total - 15000;
    return {
      theme: this.props.dark ? 'dark' : '',
      rows,
      totalPounds: whole.slice(0, -3),
      totalPence: whole.slice(-3),
      takenText: total ? (taken < 0 ? money(-taken) + ' under float' : money(taken)) : '—',
      showHint: hint,
      hidToast: toast,
      gotIt: () => this.setState({ hint: false, toast: true }),
      undo: () => this.setState({ hint: true, toast: false })
    };
  }
}
</script>
</body>
</html>
