<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account · replay the tour</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="checks.css">
<link rel="stylesheet" href="tour.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="ph scr {{theme}}" style="height: 844px">
<div class="nav"><a class="back" href="t01-ManagerPhone.dc.html"><svg width="10" height="17" viewBox="0 0 10 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 1.5L1.5 8.5l7 7"></path></svg>Home</a><span style="font-weight: 600">Account</span><span style="width: 60px"></span></div>
<div style="display: flex; flex-direction: column; gap: 36px; padding: 8px 20px 0">
<div class="hero" style="gap: 14px">
<span class="hl">Signed in</span>
<div style="display: flex; align-items: center; gap: 14px"><span class="av" style="width: 52px; height: 52px; border-radius: 26px; background: var(--onhero); color: var(--hero); font-size: 17px">JM</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 22px; font-weight: 600; letter-spacing: -0.03em">[Manager]</span><span style="font-size: 14px; color: var(--herosec)">Manager · Bunso</span></span></div>
</div>
<section class="grp" style="gap: 12px">
<div class="hd"><h2>Help</h2></div>
<div class="sub">
<button type="button" class="li" onClick="{{replay}}" style="border: 0; background: transparent; font: inherit; text-align: left; width: 100%; padding: 0; cursor: pointer"><span class="av"><svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a6 6 0 1 0 1.8-4.3M3 3v3h3"></path></svg></span><span class="tx"><span>Show me around</span><small>The one-minute tour for managers</small></span><span class="rt"><svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"></path></svg></span></button>
<div class="li"><span class="av"><svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 6.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2v.5M9 13h.01M9 16A7 7 0 1 0 9 2a7 7 0 0 0 0 14z"></path></svg></span><span class="tx"><span>Tips on new screens</span><small>One tip the first time you open something</small></span><button type="button" class="tg {{tgCls}}" aria-pressed="{{tips}}" aria-label="Tips on new screens" onClick="{{toggle}}"><span></span></button></div>
<button type="button" class="li" onClick="{{reset}}" style="border: 0; background: transparent; font: inherit; text-align: left; width: 100%; padding: 0; cursor: pointer"><span class="av"><svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9s2.5-5 6.5-5 6.5 5 6.5 5-2.5 5-6.5 5-6.5-5-6.5-5zM9 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg></span><span class="tx"><span>Show hidden tips again</span><small>{{hiddenLine}}</small></span></button>
</div>
</section>
<section class="grp" style="gap: 12px">
<div class="hd"><h2>Account</h2></div>
<div class="sub">
<div class="li"><span class="av"><svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM2.5 15a4.5 4.5 0 0 1 9 0M12 4a2.5 2.5 0 0 1 0 5M13.5 11.5A4.5 4.5 0 0 1 15.5 15"></path></svg></span><span class="tx"><span>People</span><small>Add people, change roles, reset a forgotten PIN</small></span><span class="rt"><svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"></path></svg></span></div>
<div class="li"><span class="av"><svg width="19" height="19" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 15.5H3.5v-13H7M11.5 12.5L15 9l-3.5-3.5M15 9H7"></path></svg></span><span class="tx"><span style="color: var(--bad)">Sign out</span></span></div>
</div>
</section>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
<div class="toast" role="status" style="bottom: 34px"><span>{{toastText}}</span><button type="button" onClick="{{undo}}">Undo</button></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tips: true, hidden: 3, toast: null };
  }
  renderVals() {
    const { tips, hidden, toast } = this.state;
    const texts = {
      replay: 'The tour starts on Home.',
      reset: hidden === 0 ? '3 tips will show again.' : '',
      off: 'Tips on new screens are off.',
      on: 'Tips on new screens are on.'
    };
    return {
      theme: this.props.dark ? 'dark' : '',
      tips,
      tgCls: tips ? 'on' : '',
      hiddenLine: hidden ? `You've hidden ${hidden} tips` : 'None hidden',
      toast: !!toast,
      toastText: toast ? texts[toast] : '',
      replay: () => this.setState({ toast: 'replay' }),
      toggle: () => this.setState({ tips: !tips, toast: tips ? 'off' : 'on' }),
      reset: () => { if (hidden) this.setState({ hidden: 0, toast: 'reset' }); },
      undo: () => {
        if (toast === 'reset') this.setState({ hidden: 3, toast: null });
        else if (toast === 'off' || toast === 'on') this.setState({ tips: !tips, toast: null });
        else this.setState({ toast: null });
      }
    };
  }
}
</script>
</body>
</html>
